name: 일상마녀 매일 주제 브리프

# 매일 오전 8시(KST) 뚜벅이 당일치기 '다음 주제 브리프'를 GitHub 이슈로 등록한다.
# ⚠️ 활성화 조건 2가지:
#   1) 이 워크플로 파일이 '기본 브랜치(main 등)'에 있어야 schedule 이 실제로 동작함(브랜치에만 있으면 안 돌아감).
#   2) 저장소 Secrets 에 ANTHROPIC_API_KEY (또는 CLAUDE_CODE_OAUTH_TOKEN) 등록 필요.
# 기간: 2026-08-28 까지만 실제 실행(그 뒤엔 자동으로 no-op) → '한 달' 운영.

on:
  schedule:
    - cron: "57 22 * * *"   # 22:57 UTC = 07:57 KST (매일)
  workflow_dispatch:          # 수동 테스트용

permissions:
  contents: write            # 파이프라인 체크 커밋
  issues: write              # 브리프를 이슈로 등록

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - name: 운영 기간 확인(한 달)
        id: window
        run: |
          if [ "$(date -u +%Y%m%d)" -le 20260828 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false (운영 기간 종료)"; echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 체크아웃
        if: steps.window.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: 오늘의 주제 브리프 생성
        if: steps.window.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          # 아래 둘 중 저장소에 설정한 것 하나만 있으면 됨(다른 줄은 지워도 무방)
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            너는 네이버 시니어 뚜벅이 블로그 '일상마녀'의 편집 보조다. 저장소 루트 CLAUDE.md 규칙을 따른다.
            1) `.claude/blog-topic-pipeline.md`를 읽어라.
            2) 오늘 날짜(계절) 시의성 우선으로, 아직 체크 안 된 `- [ ]` 주제 1개를 고른다('이미 발행' 목록과 겹치지 않게).
            3) 그 주제로 **아침 브리프**를 만들어 이 저장소에 **GitHub 이슈**로 등록한다(제목: "[오늘의 주제] <주제>"). 이슈 본문:
               - 🗓 추천 주제 + 왜 지금(시의성 한 줄)
               - 🏷 홈판 제목 3안(과장 없는 궁금증형 + 지역·당일치기 검색어, ≤35자)
               - ✍️ 도입 훅 3줄(지금 왜 / 궁금증 / 내 해석)
               - 🧭 개요(핵심 볼거리 3~5·교통·65세 무료할인·계절 팁) — 확정 아닌 값은 '진행 시 기자 검증' 표시
               - 끝에 "이대로 좋으면 이 저장소에서 '진행'이라고 답주시면 전체 완성본을 만들어 드려요."
            4) 고른 주제 줄을 `- [x] (제안 YYYY-MM-DD)`로 Edit 하고 커밋·푸시(다음 날 중복 방지).
            5) 남은 `- [ ]`가 3개 이하이면 이슈 말미에 "파이프라인 곧 소진 — 주제 보충 필요"를 덧붙인다.
            브리프만 만든다(본문 전체는 쓰지 않음). 짧고 스캔되게.
