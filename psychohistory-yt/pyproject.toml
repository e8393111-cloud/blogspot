[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychohistory-yt"
version = "0.1.0"
description = "Psychohistory-lens YouTube Shorts automation pipeline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "edge-tts>=6.1",
    "google-api-python-client>=2.120",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
phyt = "psychohistory_yt.cli:main"

[tool.setuptools.packages.find]
include = ["psychohistory_yt*"]

[tool.ruff]
line-length = 100
target-version = "py311"
